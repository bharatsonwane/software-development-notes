<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>database Notes</title>
  <link rel="stylesheet" href="../public/styles/common.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1>database</h1>
      <p class="muted">Folder index for database.</p>
      <div class="bar">
        <span class="chip">Self-contained HTML</span>
        <span class="chip">Deploy-friendly filename</span>
      </div>
      <button class="btn" onclick="toggleTheme()" aria-label="Toggle theme">Toggle theme</button>
    </header>
    <section>
      <h2>Subtracks</h2>
      <ul>
        <li><a href="./mongodb/README.md">mongodb/README.md</a></li>
        <li><a href="./mongodb/index.html">mongodb/index.html</a></li>
        <li><a href="./postgresql/README.md">postgresql/README.md</a></li>
        <li><a href="./postgresql/index.html">postgresql/index.html</a></li>
      </ul>
    </section>
  </div>
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    })();
    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      var isDark = document.documentElement.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }
  </script>
</body>
</html>
